<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldchelle Online Enterprises — Employee Gate</title>
<style>
  :root{
    --navy:#0e1a2b; --navy-card:#13233b; --navy-border:#24405f;
    --gold:#e0b34a; --gold-soft:#f2d386; --text:#e8eef6; --muted:#8ba3bf;
    --green:#2ecc8a; --red:#e06a6a; --blue:#4a90d9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16273f 0%, #0b1626 60%, #08111e 100%);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    padding:24px; padding-top:env(safe-area-inset-top,24px); padding-bottom:env(safe-area-inset-bottom,24px);
  }
  .gate{
    width:100%; max-width:440px; background:var(--navy-card);
    border:1px solid var(--navy-border); border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45); padding:34px 30px 30px; text-align:center;
  }
  .logo{font-size:34px; margin-bottom:6px;}
  h1{font-family:Georgia,'Times New Roman',serif; color:var(--gold); font-size:22px; margin:0 0 2px; line-height:1.2;}
  .sub{font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:24px;}
  .field{text-align:left; margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input{
    width:100%; padding:12px 14px; font-size:14px; color:var(--text);
    background:var(--navy); border:1px solid var(--navy-border); border-radius:10px; outline:none;
  }
  .field input:focus{border-color:var(--gold);}
  .btn{
    width:100%; padding:13px; font-size:15px; font-weight:700; color:#1a1206;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold)); border:none;
    border-radius:10px; cursor:pointer; margin-top:8px; transition:opacity .15s;
  }
  .btn:hover{opacity:.92;} .btn:disabled{opacity:.55; cursor:not-allowed;}
  .msg{margin-top:16px; font-size:12.5px; min-height:18px; line-height:1.5;}
  .msg.error{color:var(--red);} .msg.ok{color:var(--green);} .msg.info{color:var(--muted);}
  .foot{margin-top:22px; font-size:10px; color:var(--muted); letter-spacing:.5px;}
  .show-pw{font-size:11px; color:var(--blue); cursor:pointer; user-select:none; margin-top:4px; display:inline-block;}
</style>
</head>
<body>
  <div class="gate">
    <div class="logo">🔐</div>
    <h1>Goldchelle Online Enterprises</h1>
    <div class="sub">Logistics System · Employee Gate</div>

    <div class="field">
      <label for="g-email">Email</label>
      <input type="email" id="g-email" placeholder="employee@email.com" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="g-pass">Password</label>
      <input type="password" id="g-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <span class="show-pw" onclick="togglePw()">👁 Show password</span>
    </div>

    <button class="btn" id="g-btn" onclick="doLogin()">Enter System</button>
    <div class="msg info" id="g-msg">Ilagay ang naka-rehistrong email at password.</div>

    <div class="foot">© Goldchelle Online Enterprises · Authorized personnel only</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
  // ── CONFIG ───────────────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyBXs5CPYgUUWlwwnO99IObzlgyyglEP9Xg",
    authDomain: "goldchelle-logistics.firebaseapp.com",
    projectId: "goldchelle-logistics"
  };
  const MAIN_SYSTEM_URL = "main.html";   // ← main system file (same folder)

  function setMsg(t, cls){
    const m = document.getElementById('g-msg');
    m.innerHTML = t; m.className = 'msg ' + (cls||'info');
  }
  function togglePw(){
    const p = document.getElementById('g-pass');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  let _auth, _fbReady = false;
  try {
    firebase.initializeApp(firebaseConfig);
    _auth = firebase.auth();
    _auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
    _fbReady = true;
  } catch(e){
    setMsg('⚠️ Hindi ma-load ang Firebase. I-refresh ang page.', 'error');
  }

  function _go(){
    try { window.location.assign(MAIN_SYSTEM_URL); } catch(e){}
    setTimeout(()=>{ try { window.location.href = MAIN_SYSTEM_URL; } catch(e){} }, 300);
    setTimeout(()=>{
      // Fallback: kung hindi lumipat, bigyan ng manual link (rare).
      setMsg('✅ Naka-login! <a href="'+MAIN_SYSTEM_URL+'" style="color:var(--gold);font-weight:700;">Pumasok sa System →</a>', 'ok');
    }, 1500);
  }

  async function doLogin(){
    const email = (document.getElementById('g-email').value||'').trim().toLowerCase();
    const pass  = document.getElementById('g-pass').value||'';
    const btn   = document.getElementById('g-btn');

    if(!_fbReady){ setMsg('⚠️ Firebase hindi handa — i-refresh ang page.', 'error'); return; }
    if(!email){ setMsg('⚠️ Ilagay ang email.', 'error'); return; }
    if(!pass){ setMsg('⚠️ Ilagay ang password.', 'error'); return; }

    btn.disabled = true;
    setMsg('⏳ Vine-verify...', 'info');

    try {
      const cred = await _auth.signInWithEmailAndPassword(email, pass);
      try {
        sessionStorage.setItem('gce_gate_email', email);
        sessionStorage.setItem('gce_gate_uid', cred.user ? cred.user.uid : '');
        sessionStorage.setItem('gce_gate_ok', '1');
        sessionStorage.setItem('gce_gate_ts', String(Date.now()));
      } catch(e){}
      setMsg('✅ Welcome! Redirecting...', 'ok');
      _go();
    } catch(err){
      const code = (err && err.code) || '';
      let m = '❌ Mali ang email o password.';
      if(code === 'auth/invalid-email')            m = '❌ Hindi valid ang email format.';
      else if(code === 'auth/user-disabled')       m = '🔒 Naka-disable ang account na ito.';
      else if(code === 'auth/user-not-found')      m = '❌ Walang account na ganitong email.';
      else if(code === 'auth/wrong-password')      m = '❌ Mali ang password.';
      else if(code === 'auth/invalid-credential')  m = '❌ Mali ang email o password.';
      else if(code === 'auth/too-many-requests')   m = '⏳ Sobrang daming attempt — sandali muna.';
      else if(code === 'auth/network-request-failed') m = '⚠️ Walang internet connection.';
      else if(code === 'auth/operation-not-allowed')  m = '⚠️ Email/Password hindi enabled sa Firebase.';
      else if(code === 'auth/unauthorized-domain')    m = '⚠️ Domain hindi authorized sa Firebase.';
      setMsg(m, 'error');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
